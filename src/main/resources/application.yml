spring:
  application:
    name: ecommerce-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: 123123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: vietprodev-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration-ms: 86400000

vnpay:
  tmn-code: VSUMZHNG
  hash-secret: EHHY40NBTOOMQV68RX2X6HU0TEQXUVDB
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8081/api/payment/vnpay-return
